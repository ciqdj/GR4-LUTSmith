[project]
name = "gr4-lutsmith"
version = "1.1.0"
description = "Put the look of a .cube LUT into a RICOH GR IV (firmware 1.11)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
# Only for --photo and preview (reading DNG files, writing the preview sheet)
photo = [
    "rawpy>=0.18",
    "pillow>=9",
]

[tool.uv]
package = false
