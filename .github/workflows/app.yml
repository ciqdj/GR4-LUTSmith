# Builds the GR4-LUTSmith app for macOS (Apple Silicon and Intel) and Windows (x64) and, for a version tag,
# attaches the zips and SHA256SUMS to a draft release (published by hand after testing). Each zip gets a signed
# build provenance, so users can check it was built here: gh attestation verify <zip> --repo <this repository>.
name: App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }
          - { os: macos-14, arch: x86_64 }     # Intel build, made under Rosetta (the same route as local builds)
          - { os: windows-2022, arch: '' }
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'          # UTF-8 everywhere (Windows consoles default to a legacy code page)
    permissions:
      contents: read
      id-token: write          # signs the build provenance (Sigstore)
      attestations: write      # stores it with the repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Rosetta (Intel build)
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Set up
        run: uv sync --python 3.12 --extra app
      - name: Checks (no RICOH file needed)
        run: uv run python tests/test_app.py
      - name: Build
        shell: bash
        run: uv run python packaging/build.py ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }}
      - name: Build provenance (anyone can check where the zip came from)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}-${{ matrix.arch || 'x64' }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat *.zip.sha256 > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
